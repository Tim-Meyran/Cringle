name: Issue housekeeping

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  remove-in-progress:
    name: Remove in-progress label
    runs-on: [self-hosted, Linux, X64, rocky]
    steps:
      # the API of the actions toolkit: no gh (or any other tool) is needed on the runner
      - name: Remove label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.issue.number, name: 'in-progress' });
            } catch (e) {
              if (e.status !== 404) throw e; // the issue had no such label
            }
