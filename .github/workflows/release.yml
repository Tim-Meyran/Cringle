name: Release

# A tag like v1.2.3 (or v1.2.3-rc.1) builds the distribution and attaches it to a GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '$tag' is not a version tag like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # the tests run against the version of the release, so DistributionTest checks the archives that are published
      - name: Build and test
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Build the distribution
        run: ./gradlew cringleDist --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      # the installers (installer/) are attached to the release; install.ps1 registers the services with WinSW, which is
      # attached as winsw.exe (pinned version and checksum) and listed in SHA256SUMS like the archives
      - name: Add the installers and WinSW
        run: |
          curl -fsSL -o build/dist/winsw.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe
          echo "b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f  build/dist/winsw.exe" | sha256sum -c -
          (cd build/dist && sha256sum winsw.exe >> SHA256SUMS)
          cp installer/install.sh installer/install.ps1 build/dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            build/dist/cringle-${{ steps.version.outputs.version }}-linux.tar.gz \
            build/dist/cringle-${{ steps.version.outputs.version }}-windows.zip \
            build/dist/SHA256SUMS \
            build/dist/manifest.json \
            --title "Cringle ${{ steps.version.outputs.version }}" \
            --generate-notes \
            $prerelease
