name: Release

# A tag like v1.2.3 (or v1.2.3-rc.1) builds the distribution and attaches it to a GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish the release
    runs-on: [self-hosted, Linux, X64, rocky]
    steps:
      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '$tag' is not a version tag like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release does not run all the integration tests again (they take an hour on the runner): the commit of the tag was tested by CI. This
      # step stops the release when CI failed or still runs for the commit; no run at all (a document-only commit, a commit that never was on
      # master) is a warning only.
      - name: Check the CI result of the commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', head_sha: context.sha, per_page: 30 });
            const runs = data.workflow_runs;
            if (runs.length === 0) {
              core.warning(`CI has no run for ${context.sha}: nothing to check. Make sure that the commit was tested (docs/releasing.md).`);
              return;
            }
            if (runs.some(r => r.status === 'completed' && r.conclusion === 'success')) {
              core.info('CI passed for this commit.');
              return;
            }
            const links = runs.map(r => `${r.html_url} (${r.status}${r.conclusion ? ', ' + r.conclusion : ''})`).join('\n');
            core.setFailed(`CI has not passed for ${context.sha}; no release from this commit. Runs:\n${links}`);

      # the fast suite, and the check of the archives that are published (DistributionTest runs against the version of the release)
      - name: Build and check the archives
        run: ./gradlew build :cli:integrationTest --tests '*DistributionTest*' --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Build the distribution
        run: ./gradlew cringleDist --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      # the installers (installer/) are attached to the release; install.ps1 registers the services with WinSW, which is
      # attached as winsw.exe (pinned version and checksum) and listed in SHA256SUMS like the archives
      - name: Add the installers and WinSW
        run: |
          curl -fsSL -o build/dist/winsw.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe
          echo "b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f  build/dist/winsw.exe" | sha256sum -c -
          (cd build/dist && sha256sum winsw.exe >> SHA256SUMS)
          cp installer/install.sh installer/install.ps1 build/dist/

      # the release is made with the API of the actions toolkit: no gh is needed on the runner. It can be run again for the same tag (a run that
      # failed half way, or a release that was made by hand): the release is reused, a file of the same name is replaced, and the release is only
      # published when all files are there
      - name: Create the release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const tag = context.ref.replace('refs/tags/', '');
            const prerelease = version.includes('-');
            const files = [`cringle-${version}-linux.tar.gz`, `cringle-${version}-windows.zip`, 'SHA256SUMS', 'manifest.json', 'winsw.exe', 'install.sh', 'install.ps1'];
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
              core.info(`The release for ${tag} exists already (${release.draft ? 'a draft' : 'published'}); it is completed.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `Cringle ${version}`, draft: true, generate_release_notes: true, prerelease,
              })).data;
            }
            for (const name of files) {
              for (const old of release.assets.filter((a) => a.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: old.id });
              }
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data: fs.readFileSync(`build/dist/${name}`) });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, prerelease });
