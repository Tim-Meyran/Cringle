name: Release

# A tag like v1.2.3 (or v1.2.3-rc.1) builds the distribution and attaches it to a GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '$tag' is not a version tag like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # the tests run against the version of the release, so DistributionTest checks the archives that are published
      - name: Build and test
        run: ./gradlew build --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Download WinSW
        run: |
          mkdir -p build/dist
          curl -fsSL https://github.com/winsw/winsw/releases/download/v2.12.1/WinSW-x64.exe -o build/dist/WinSW-winsw.exe
          sha256sum build/dist/WinSW-winsw.exe | awk '{print $1}' > build/dist/WinSW-winsw.exe.sha256

      - name: Build the distribution
        run: ./gradlew cringleDist --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            build/dist/cringle-${{ steps.version.outputs.version }}-linux.tar.gz \
            build/dist/cringle-${{ steps.version.outputs.version }}-windows.zip \
            build/dist/SHA256SUMS \
            build/dist/manifest.json \
            build/dist/WinSW-winsw.exe \
            build/dist/WinSW-winsw.exe.sha256 \
            --title "Cringle ${{ steps.version.outputs.version }}" \
            --generate-notes \
            $prerelease
