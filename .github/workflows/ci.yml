name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# one runner runs one job at a time: a newer push to the same branch replaces the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, Linux, X64, rocky]
          - name: windows
            runner: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build integrationTest --no-daemon

  installer-linux:
    name: Installer (${{ matrix.image }})
    runs-on: [self-hosted, Linux, X64, rocky]
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test install.sh in a container
        run: installer/tests/test-install-container.sh ${{ matrix.image }}

  installer-windows:
    name: Installer (windows)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # the runner is administrative: this includes the tests of the service and of PATH
      - name: Test install.ps1
        shell: powershell
        run: .\installer\tests\InstallerTest.ps1
