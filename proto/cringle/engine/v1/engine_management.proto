syntax = "proto3";

package cringle.engine.v1;

import "cringle/common/v1/cert.proto";
import "cringle/common/v1/identifiers.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "cringle.engine.v1";

// Management API of a single Engine (skeleton: status and configuration).
service EngineManagementService {
  // Returns the current status of the Engine.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Changes the Engine configuration. Only fields that are set are changed.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);

  // Creates a fabric instance of a blueprint from unpacked packages in the Cringle home. The fabric is not started.
  rpc DeployFabric(DeployFabricRequest) returns (FabricInfo);

  // Replaces the Engines that may call the provided service ports of a fabric. Callers that stay are not touched, new
  // ones are accepted from now on, removed ones are refused and their open calls are ended.
  rpc SetServiceCallers(SetServiceCallersRequest) returns (SetServiceCallersResponse);

  // Replaces the instances of a service that the running fabric calls (its binding), without a redeploy. The tether
  // switches to the first reachable instance of the new list; calls in flight on a connection that is left fail.
  rpc UpdateServiceBindings(UpdateServiceBindingsRequest) returns (UpdateServiceBindingsResponse);

  // Starts a deployed fabric.
  rpc StartFabric(FabricRequest) returns (FabricInfo);

  // Stops a running fabric; it can be started again.
  rpc StopFabric(FabricRequest) returns (FabricInfo);

  // Stops (if needed) and removes a fabric.
  rpc RemoveFabric(FabricRequest) returns (RemoveFabricResponse);

  // Lists all fabrics of this Engine.
  rpc ListFabrics(ListFabricsRequest) returns (ListFabricsResponse);

  // Returns the status of one fabric.
  rpc GetFabricStatus(FabricRequest) returns (FabricInfo);

  // Queries the persistent log store of the Engine (blocks log through the built-in logging driver).
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);

  // Removes package versions from the machine cache that no fabric of an Engine on this machine uses and that have
  // not been used for the given time. The cache is shared by all Engines of the machine.
  rpc CleanupCache(CleanupCacheRequest) returns (CleanupCacheResponse);
}

// Lifecycle state of an Engine process.
enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  ENGINE_STATE_RUNNING = 1;
  ENGINE_STATE_STOPPING = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  cringle.common.v1.EngineId engine_id = 1;
  string name = 2;
  EngineState state = 3;
  google.protobuf.Timestamp started_at = 4;
  // Public certificate metadata of the Engine identity. Never contains key material.
  cringle.common.v1.CertificateInfo certificate = 5;
  // Address of the local Router; empty until configured.
  string router_address = 6;
  // SHA-256 of the public key of the Engine identity, 64 lower case hex characters. This is the key that other Engines
  // and the ManagementServer trust (Architecture chapter 5); the certificate fingerprint above changes with a renewal.
  string public_key_fingerprint = 7;
  // Port of the tether service for tethers between Engines (spec/tether.md); 0 if the Engine has none.
  int32 tether_port = 8;
}

message ConfigureRequest {
  // Address of the local Router as host:port. Unset leaves the value unchanged; an empty string clears it.
  optional string router_address = 1;
}

message ConfigureResponse {
  // Address of the local Router after the change.
  string router_address = 1;
}

// Trust status of a plugin, set centrally in the Repository.
enum PluginTrust {
  // Not specified; treated as untrusted (fail closed).
  PLUGIN_TRUST_UNSPECIFIED = 0;
  PLUGIN_TRUST_TRUSTED = 1;
  PLUGIN_TRUST_UNTRUSTED = 2;
}

// A plugin version to load for a fabric, with its trust status.
message DeployedPlugin {
  cringle.common.v1.PluginRef plugin = 1;
  PluginTrust trust = 2;
}

message DeployFabricRequest {
  cringle.common.v1.FabricId fabric_id = 1;
  cringle.common.v1.ProjectRef project = 2;
  // Name of the blueprint inside the project.
  string blueprint = 3;
  // Exact plugin versions (from the lock); each must be unpacked in the Cringle home.
  repeated DeployedPlugin plugins = 4;
  // Where to download packages that are not yet in the machine cache. Unset: the packages must already be unpacked.
  PackageSource source = 5;
  // Public key fingerprints (64 lower case hex characters) of the Engines that may call the provided service ports of the
  // blueprint, see SetServiceCallers.
  repeated string service_callers = 6;
  // The concrete far ends of the service tethers of the blueprint (a tether whose `remote` names a service). A service
  // without a binding stays unbound and the fabric is refused when it starts; a binding that no tether uses is ignored.
  repeated ServiceBinding service_bindings = 7;
}

// Where the service `service` is: the port `block`.`port` of the fabric `fabric`, on the Engine with the public key
// `fingerprint` (the fields of a `remote` of a blueprint without an address: the router finds the Engine).
message ServiceBinding {
  string service = 1;
  string fabric = 2;
  string block = 3;
  string port = 4;
  string fingerprint = 5;
  // Further instances of the same service, in the order of preference (#173). Their own `fallbacks` are ignored.
  repeated ServiceBinding fallbacks = 6;
}

message UpdateServiceBindingsRequest {
  cringle.common.v1.FabricId fabric_id = 1;
  // The bindings that change; a service of the fabric that is not named keeps its binding.
  repeated ServiceBinding bindings = 2;
}

message UpdateServiceBindingsResponse {}

message SetServiceCallersRequest {
  cringle.common.v1.FabricId fabric_id = 1;
  repeated string fingerprints = 2;
}

message SetServiceCallersResponse {}

// What a package in the cache is.
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_PROJECT = 1;
  ARTIFACT_KIND_PLUGIN = 2;
}

// One package version with the hash it must have (from the lock).
message PackageArtifact {
  ArtifactKind kind = 1;
  string name = 2;
  string version = 3;
  // SHA-256 of the package file, lower case hex.
  string sha256 = 4;
}

// Repository and packages a deployment needs. The Engine downloads what is missing, verifies the hash and unpacks
// each version once into the machine cache (shared by all Engines of the machine).
message PackageSource {
  // host:port of the Repository.
  string repository_address = 1;
  // Bearer token for the Repository; empty if it needs none. Never persisted by the Engine.
  string token = 2;
  repeated PackageArtifact artifacts = 3;
}

message CleanupCacheRequest {
  // Only versions unused for at least this many seconds are removed; 0 removes all unused versions.
  int64 min_unused_seconds = 1;
}

message CleanupCacheResponse {
  // The removed versions as `<kind>/<name>@<version>`.
  repeated string removed = 1;
  // Versions that could not be removed (for example a locked file), as `<kind>/<name>@<version>: <reason>`.
  // They are still in the cache, complete.
  repeated string failed = 2;
}

message FabricRequest {
  cringle.common.v1.FabricId fabric_id = 1;
}

// Lifecycle state of a fabric.
enum FabricRuntimeState {
  FABRIC_RUNTIME_STATE_UNSPECIFIED = 0;
  FABRIC_RUNTIME_STATE_CREATED = 1;
  FABRIC_RUNTIME_STATE_STARTING = 2;
  FABRIC_RUNTIME_STATE_RUNNING = 3;
  FABRIC_RUNTIME_STATE_STOPPING = 4;
  FABRIC_RUNTIME_STATE_STOPPED = 5;
  FABRIC_RUNTIME_STATE_FAILED = 6;
}

// Lifecycle state of a block.
enum BlockRuntimeState {
  BLOCK_RUNTIME_STATE_UNSPECIFIED = 0;
  BLOCK_RUNTIME_STATE_CREATED = 1;
  BLOCK_RUNTIME_STATE_STARTING = 2;
  BLOCK_RUNTIME_STATE_RUNNING = 3;
  BLOCK_RUNTIME_STATE_RESTARTING = 4;
  BLOCK_RUNTIME_STATE_STOPPING = 5;
  BLOCK_RUNTIME_STATE_STOPPED = 6;
  BLOCK_RUNTIME_STATE_FAILED = 7;
}

message BlockInfo {
  cringle.common.v1.BlockId block_id = 1;
  BlockRuntimeState state = 2;
  int32 restarts = 3;
  // Last crash, empty if none.
  string last_error = 4;
}

message FabricInfo {
  cringle.common.v1.FabricId fabric_id = 1;
  string blueprint = 2;
  FabricRuntimeState state = 3;
  repeated BlockInfo blocks = 4;
  // Why the fabric failed, empty if it did not.
  string failure = 5;
}

message RemoveFabricResponse {}

message ListFabricsRequest {}

message ListFabricsResponse {
  repeated FabricInfo fabrics = 1;
}

// Severity of a log entry.
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string fabric = 2;
  string block = 3;
  LogLevel level = 4;
  string message = 5;
}

message QueryLogsRequest {
  // Only entries of this fabric; empty means all.
  string fabric = 1;
  // Only entries of this block; empty means all.
  string block = 2;
  // Only entries at or above this level; unspecified means DEBUG.
  LogLevel min_level = 3;
  // Only entries at or after this time; unset means no limit.
  google.protobuf.Timestamp since = 4;
  // At most this many entries (the newest ones, oldest first); 0 means the default of 1000.
  int32 limit = 5;
}

message QueryLogsResponse {
  repeated LogEntry entries = 1;
}
