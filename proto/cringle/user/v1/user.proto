syntax = "proto3";

package cringle.user.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "cringle.user.v1";

// Users, groups and access tokens of the Registry. Every call needs an access token in the `authorization` header
// (`Bearer <token>`); creating, listing and revoking needs the admin role, WhoAmI works for every valid token.
service UserService {
  // Creates a user.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Lists all users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Deletes a user and revokes the user's tokens.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // Creates a group with roles.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);

  // Lists all groups.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // Creates a token for a user. The token itself is only returned by this call.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);

  // Lists the tokens of a user (without the token values).
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);

  // Revokes a token.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // Gives a user or a group a role for one object only (a machine, a project, a fabric or a framework function).
  rpc GrantRole(RoleScopeRequest) returns (RoleScopeResponse);

  // Takes a scoped role of a user or a group back.
  rpc RevokeRole(RoleScopeRequest) returns (RoleScopeResponse);

  // Returns the user the presented token belongs to.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // Trusts the registry of another site: its users are accepted as `name@registry` with a token that it signed (Architecture 6.2).
  rpc TrustRegistry(TrustRegistryRequest) returns (TrustRegistryResponse);

  // Stops trusting a registry; its tokens are refused from now on.
  rpc UntrustRegistry(UntrustRegistryRequest) returns (UntrustRegistryResponse);

  // Lists the trusted registries with their rights. Rights are given with GrantRole and RevokeRole (`registry` names the subject).
  rpc ListRegistries(ListRegistriesRequest) returns (ListRegistriesResponse);

  // Issues a token for a user of this site that another registry, which trusts this one, accepts as `user@<registry_name>`.
  rpc IssueFederatedToken(IssueFederatedTokenRequest) returns (IssueFederatedTokenResponse);

  // The public key with which this site signs federated tokens: the other site enters it with TrustRegistry.
  rpc GetRegistryKey(GetRegistryKeyRequest) returns (GetRegistryKeyResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  // Everything, including user management.
  ROLE_ADMIN = 1;
  // Deploy, start and stop, read.
  ROLE_OPERATOR = 2;
  // Read only.
  ROLE_VIEWER = 3;
  // End user of an application built with Cringle; no management rights.
  ROLE_END_USER = 4;
}

enum ScopeKind {
  SCOPE_KIND_UNSPECIFIED = 0;
  // Everything.
  SCOPE_KIND_GLOBAL = 1;
  SCOPE_KIND_MACHINE = 2;
  SCOPE_KIND_PROJECT = 3;
  SCOPE_KIND_FABRIC = 4;
  // A framework function: "trust", "plugin-trust" or "users".
  SCOPE_KIND_FUNCTION = 5;
}

// The object a role applies to; `name` is empty for the global scope.
message Scope {
  ScopeKind kind = 1;
  string name = 2;
}

// A role limited to a scope.
message RoleAssignment {
  Role role = 1;
  Scope scope = 2;
}

message RoleScopeRequest {
  // Exactly one of the three names the subject.
  string user_id = 1;
  string group = 2;
  Role role = 3;
  Scope scope = 4;
  // A trusted registry: all of its users.
  string registry = 5;
}

message RoleScopeResponse {
  // The user, the group or the registry after the change.
  User user = 1;
  Group group = 2;
  Registry registry = 3;
}

// A registry of another site that is trusted.
message Registry {
  string name = 1;
  // SHA-256 of the public key, 64 lower case hex characters: what the administrator compares with the other site.
  string fingerprint = 2;
  // Roles of every user of the registry.
  repeated Role roles = 3;
  repeated RoleAssignment scoped_roles = 4;
}

message TrustRegistryRequest {
  string name = 1;
  // The public key of the other registry as PEM (`PUBLIC KEY`), or its certificate (`CERTIFICATE`).
  string public_key_pem = 2;
  repeated Role roles = 3;
}

message TrustRegistryResponse {
  Registry registry = 1;
}

message UntrustRegistryRequest {
  string name = 1;
}

message UntrustRegistryResponse {}

message ListRegistriesRequest {}

message ListRegistriesResponse {
  repeated Registry registries = 1;
}

message IssueFederatedTokenRequest {
  // The name under which the other site has entered this registry (it is `iss` in the token).
  string registry_name = 1;
  // The user of this site the token is for; the other site sees `user@registry_name`.
  string user = 2;
  // Lifetime in seconds, 1 to 30 days.
  int64 ttl_seconds = 3;
}

message IssueFederatedTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetRegistryKeyRequest {}

message GetRegistryKeyResponse {
  string public_key_pem = 1;
  string fingerprint = 2;
}

message User {
  string id = 1;
  string name = 2;
  // Roles given to the user directly.
  repeated Role roles = 3;
  repeated string groups = 4;
  // Roles the user has including those of its groups.
  repeated Role effective_roles = 5;
  // Roles limited to an object, given to the user directly.
  repeated RoleAssignment scoped_roles = 6;
  // Scoped roles including those of the groups.
  repeated RoleAssignment effective_scoped_roles = 7;
}

message Group {
  string name = 1;
  repeated Role roles = 2;
  repeated RoleAssignment scoped_roles = 3;
}

message TokenInfo {
  string id = 1;
  string user_id = 2;
  string label = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset if the token does not expire.
  google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
}

message CreateUserRequest {
  string name = 1;
  repeated Role roles = 2;
  repeated string groups = 3;
}

message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {}

message CreateGroupRequest {
  string name = 1;
  repeated Role roles = 2;
}

message CreateGroupResponse {
  Group group = 1;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateTokenRequest {
  string user_id = 1;
  string label = 2;
  // Lifetime in seconds; 0 means the token does not expire.
  int64 ttl_seconds = 3;
}

message CreateTokenResponse {
  // The token value. It cannot be retrieved again.
  string token = 1;
  TokenInfo info = 2;
}

message ListTokensRequest {
  string user_id = 1;
}

message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}

message RevokeTokenRequest {
  string token_id = 1;
}

message RevokeTokenResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  User user = 1;
}
