syntax = "proto3";

package cringle.daemon.v1;

import "cringle/common/v1/identifiers.proto";
import "cringle/engine/v1/engine_management.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "cringle.daemon.v1";

// The Daemon of a machine: creates Engines and runs and supervises their processes.
service DaemonService {
  // Registers a new Engine in the local engine register. Does not start it.
  rpc CreateEngine(CreateEngineRequest) returns (EngineInfo);

  // Starts the process of a registered Engine and waits until its management API is up.
  rpc StartEngine(EngineRequest) returns (EngineInfo);

  // Stops the Engine process gracefully (forcibly after a timeout).
  rpc StopEngine(EngineRequest) returns (EngineInfo);

  // Stops (if running) and starts an Engine.
  rpc RestartEngine(EngineRequest) returns (EngineInfo);

  // Stops an Engine and removes it from the register. Its data directory is kept unless delete_data is set.
  rpc DeleteEngine(DeleteEngineRequest) returns (DeleteEngineResponse);

  // Lists all registered Engines with their process state.
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);

  // Returns one Engine.
  rpc GetEngine(EngineRequest) returns (EngineInfo);

  // Starts every registered Engine that is not running (used after a machine restart).
  rpc StartAllEngines(StartAllEnginesRequest) returns (ListEnginesResponse);

  // Switches the LoggingCollector of the machine on or off for one Engine (Architecture 16.1). The collector pulls the entries of the
  // logging driver of a running Engine and keeps them, so that they can be read when the Engine is stopped.
  rpc SetLogCollection(SetLogCollectionRequest) returns (SetLogCollectionResponse);

  // The entries the collector has kept for an Engine.
  rpc QueryCollectedLogs(QueryCollectedLogsRequest) returns (QueryCollectedLogsResponse);

  // The settings of the machine (the key-value store `<home>/config/cringle.conf`, #314): every key of the catalog with its value.
  rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);

  // One setting.
  rpc GetConfig(GetConfigRequest) returns (ConfigEntry);

  // Changes a setting and restarts what it affects (the repository, the management server, the set of programs); a change of the address or
  // the port of the daemon itself is saved and `restart_required` says so.
  rpc SetConfig(SetConfigRequest) returns (ConfigChange);

  // Removes a setting from the store: its default is in effect again. Restarts like SetConfig.
  rpc UnsetConfig(UnsetConfigRequest) returns (ConfigChange);
}

// A setting of the machine with the value in effect.
message ConfigEntry {
  string key = 1;
  string value = 2;
  string default_value = 3;
  // Whether the store has the key (otherwise `value` is the default).
  bool is_set = 4;
  // `port`, `loopback|all`, `list` or `url`.
  string type = 5;
  string description = 6;
  // What a change restarts: `daemon`, `management`, `repository` or `components`.
  repeated string restarts = 7;
  // The daemon was started with an argument for this key; the argument wins over the store until the daemon is started without it.
  bool overridden = 8;
}

message ListConfigRequest {}

message ListConfigResponse {
  repeated ConfigEntry entries = 1;
  // Lines of the file that cannot be used (unknown key, a value the catalog refuses).
  repeated string problems = 2;
}

message GetConfigRequest {
  string key = 1;
}

message SetConfigRequest {
  string key = 1;
  string value = 2;
}

message UnsetConfigRequest {
  string key = 1;
}

message ConfigChange {
  ConfigEntry entry = 1;
  // The programs that were restarted: `repository`, `management`.
  repeated string restarted = 2;
  // The daemon itself has to be restarted for the change to take effect.
  bool restart_required = 3;
  // Said to the person when `restart_required` is set or the key is overridden by an argument.
  string note = 4;
}

// State of an Engine process as seen by the Daemon.
enum EngineProcessState {
  ENGINE_PROCESS_STATE_UNSPECIFIED = 0;
  // Registered, no process.
  ENGINE_PROCESS_STATE_STOPPED = 1;
  ENGINE_PROCESS_STATE_STARTING = 2;
  ENGINE_PROCESS_STATE_RUNNING = 3;
  ENGINE_PROCESS_STATE_STOPPING = 4;
  // The process ended without being asked to (killed or crashed); see exit_code.
  ENGINE_PROCESS_STATE_CRASHED = 5;
}

message EngineInfo {
  cringle.common.v1.EngineId engine_id = 1;
  string name = 2;
  EngineProcessState state = 3;
  // Process id; 0 if there is no process.
  int64 pid = 4;
  // Port of the Engine management API on the loopback interface; 0 if not running.
  int32 management_port = 5;
  google.protobuf.Timestamp started_at = 6;
  // Exit code of the last process that ended; only meaningful in STOPPED and CRASHED.
  int32 exit_code = 7;
  // Description of the last failure, empty if none.
  string last_error = 8;
}

message CreateEngineRequest {
  // Optional; the Daemon allocates an id if empty. Must match [a-z0-9][a-z0-9-]{0,62}.
  string engine_id = 1;
  // Optional display name; defaults to the id.
  string name = 2;
}

message EngineRequest {
  cringle.common.v1.EngineId engine_id = 1;
}

message DeleteEngineRequest {
  cringle.common.v1.EngineId engine_id = 1;
  // Also delete the Engine's data directory (config, identity, fabrics).
  bool delete_data = 2;
}

message DeleteEngineResponse {}

message ListEnginesRequest {}

message ListEnginesResponse {
  repeated EngineInfo engines = 1;
}

message StartAllEnginesRequest {}

message SetLogCollectionRequest {
  cringle.common.v1.EngineId engine_id = 1;
  bool enabled = 2;
}

message SetLogCollectionResponse {}

message QueryCollectedLogsRequest {
  cringle.common.v1.EngineId engine_id = 1;
  string fabric = 2;
  string block = 3;
  cringle.engine.v1.LogLevel min_level = 4;
  google.protobuf.Timestamp since = 5;
  // 0 means the default of 1000.
  int32 limit = 6;
}

message QueryCollectedLogsResponse {
  // Whether the collector is switched on for the Engine; without it there is nothing to read.
  bool enabled = 1;
  repeated cringle.engine.v1.LogEntry entries = 2;
}
