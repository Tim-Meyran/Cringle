syntax = "proto3";

package cringle.dummy.v1;

option java_multiple_files = true;
option java_package = "cringle.dummy.v1";

message DummyMessage {
  string id = 1;
  string content = 2;
}

service DummyService {
  rpc Ping (DummyMessage) returns (DummyMessage);
}
