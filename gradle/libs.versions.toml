[versions]
kotlin = "2.1.10"
coroutines = "1.10.1"
serialization-json = "1.8.0"
junit = "5.11.4"
spotless = "7.0.2"
protobuf = "4.29.3"
protobuf-plugin = "0.9.4"
grpc = "1.70.0"
grpc-kotlin = "1.4.1"
bouncycastle = "1.80"
jserialcomm = "2.11.4"

# Version under which contract, schema, packaging and the Cringle Gradle plugin itself are published locally: into
# build/cringle-repo, which the samples of the Gradle plugin use, and into Maven Local, which projects outside this
# build use. It exists only inside this repository and is never published anywhere else.
localPublish = "0.0.0-SNAPSHOT"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# Protobuf and gRPC
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }

# Cryptography (X.509 generation)
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Serial ports
jserialcomm = { module = "com.fazecast:jSerialComm", version.ref = "jserialcomm" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
